name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/NVXO-CEX-${{ github.run_number }}.apk
          ls -la dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: NVXO-CEX-apk-${{ github.run_number }}
          path: dist-apk/*.apk

      - name: Publish as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NVXO CEX · build ${{ github.run_number }}
          body: |
            Installable demo APK of NVXO CEX (commit ${{ github.sha }}).
            Download the .apk below on your Android phone and open it (allow "Install unknown apps" if asked).
          files: dist-apk/*.apk
          prerelease: true
